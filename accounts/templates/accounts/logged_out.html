{% extends 'base.html' %}
{% block title %}Signed out | NourishLoop{% endblock %}
{% block content %}
<section class="logout-page">
    <div class="logout-art" aria-hidden="true"><span class="logout-orbit orbit-one"></span><span class="logout-orbit orbit-two"></span><span class="logout-center">N</span></div>
    <div class="logout-copy">
        <span class="eyebrow">Session ended</span>
        <h1>Thanks for being part of the loop.</h1>
        <p>You’re safely signed out. Good food will be here when you’re ready to return.</p>
        <div class="logout-actions"><a class="button button-dark" href="{% url 'login' %}">Log in again <span aria-hidden="true">↗</span></a><a class="text-link" href="{% url 'home' %}">Back to home</a></div>
    </div>
</section>
{% endblock %}
